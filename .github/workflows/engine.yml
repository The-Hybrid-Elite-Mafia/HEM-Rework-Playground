name: Build and test the C++23 Playground engine

# The new HEM Rework Playground engine (hc-engine/: C++23, no JUCE) on a Windows machine in the cloud:
# builds every plug-in engine with Visual Studio 2022, runs the engine tests, then renders 1,322
# scenarios through the 0.10.0 JUCE plug-ins and the new engines and compares every output, then opens
# songs saved by 0.10.0 (sessions, stems in every format, exports) with the new engine.
# Manual only (workflow_dispatch). Results are written as notices on the run (readable from the API).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Configure the engine (C++23, MSVC)
        run: cmake -S hc-engine -B build-engine -G "Visual Studio 17 2022" -A x64

      - name: Build the engine, tests and the render checker
        shell: pwsh
        run: |
          $out = cmake --build build-engine --config Release --parallel 2>&1
          $rc = $LASTEXITCODE
          $out | Set-Content engine-build.txt
          $out | Select-String -Pattern ': (fatal )?error ' | Select-Object -First 40 | ForEach-Object { Write-Host "::error title=compile::$($_.Line.Trim())" }
          $w = ($out | Select-String -Pattern ': warning C').Count
          Write-Host "::notice title=build::$w compiler warnings"
          $out | Select-String -Pattern ': warning C' | Select-Object -First 25 | ForEach-Object { Write-Host "::warning title=compile::$($_.Line.Trim())" }
          exit $rc

      - name: Run the engine tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          function Report($level, $title, $lines) { $m = (($lines | ForEach-Object { "$_" }) -join "`n").Replace('%','%25').Replace("`r",'').Replace("`n",'%0A'); if ($m) { Write-Host "::$level title=$title::$m" } }
          & build-engine\Release\hem_pg_tests.exe *> engine-tests.txt
          $rc = $LASTEXITCODE
          $out = Get-Content engine-tests.txt
          Report error "engine test failures" ($out | Select-String -Pattern '^!!!|\[FAIL\]' | Select-Object -First 60)
          Report notice "engine tests" ($out | Select-String -Pattern 'HEM ENGINE TEST SUMMARY')
          exit $rc

      - name: Measure CPU time per block (this cloud machine, not Steven's PC)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          function Report($level, $title, $lines) { $m = (($lines | ForEach-Object { "$_" }) -join "`n").Replace('%','%25').Replace("`r",'').Replace("`n",'%0A'); if ($m) { Write-Host "::$level title=$title::$m" } }
          & build-engine\Release\hem_pg_bench.exe *> bench.txt
          $cpu = Get-CimInstance Win32_Processor | ForEach-Object { "$($_.Name.Trim()), $($_.NumberOfCores) cores" }
          Report notice "cpu" (@($cpu) + (Get-Content bench.txt))

      - name: Build the 0.10.0 plug-ins as a renderer (JUCE 8.0.15, only for the comparison)
        run: |
          cmake -S hc-engine/tools/legacy-render -B build-legacy -G "Visual Studio 17 2022" -A x64
          cmake --build build-legacy --config Release --parallel

      - name: Compare every render, 0.10.0 vs the new engines (48, 44.1 and 96 kHz)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          function Report($level, $title, $lines) { $m = (($lines | ForEach-Object { "$_" }) -join "`n").Replace('%','%25').Replace("`r",'').Replace("`n",'%0A'); if ($m) { Write-Host "::$level title=$title::$m" } }
          $legacy = Get-ChildItem build-legacy -Recurse -Include LegacyRender.exe, legacy-render.exe | Select-Object -First 1
          if (-not $legacy) { Report error "legacy render" "the 0.10.0 renderer was not built"; exit 1 }
          $fail = 0
          foreach ($rate in 48000, 44100, 96000) {
            $d = "cmp$rate"
            New-Item -ItemType Directory -Force $d | Out-Null
            & $legacy.FullName $d --rate $rate *> "legacy-render-$rate.txt"
            if ($LASTEXITCODE -ne 0) { Report error "legacy render $rate" (Get-Content "legacy-render-$rate.txt" -Tail 15); $fail = 1; continue }
            & build-engine\Release\hem_pg_render.exe $d --fixes hc-engine\tools\render\known-fixes.txt *> "port-compare-$rate.txt"
            if ($LASTEXITCODE -ne 0) { $fail = 1 }
            $out = Get-Content "port-compare-$rate.txt"
            $summary = $out | Select-String -Pattern 'HEM PORT SUMMARY'
            Report notice "port compare $rate Hz" (@($summary) + ($out | Select-String -Pattern '^PLUGIN'))
            Report error "port differs $rate Hz" ($out | Select-String -Pattern '^DIFFERS|^MISSING|^UNKNOWN' | Select-Object -First 60)
            if (-not $summary) { Report error "render output $rate Hz" ($out | Select-Object -Last 15) }
          }
          exit $fail

      - name: Open 0.10.0 songs with the new engine (sessions, stems, exports, Band Forge)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          function Report($level, $title, $lines) { $m = (($lines | ForEach-Object { "$_" }) -join "`n").Replace('%','%25').Replace("`r",'').Replace("`n",'%0A'); if ($m) { Write-Host "::$level title=$title::$m" } }
          $legacy = Get-ChildItem build-legacy -Recurse -Include LegacyRender.exe, legacy-render.exe | Select-Object -First 1
          & $legacy.FullName songs --sessions *> legacy-sessions.txt
          if ($LASTEXITCODE -ne 0) { Report error "0.10.0 songs" (Get-Content legacy-sessions.txt -Tail 15); exit 1 }
          & build-engine\Release\hem_pg_session_check.exe songs *> session-check.txt
          $rc = $LASTEXITCODE
          $out = Get-Content session-check.txt
          Report notice "songs" ((Get-Content legacy-sessions.txt) + $out)
          exit $rc

      - name: Keep the test and comparison logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: engine-logs
          path: |
            engine-build.txt
            engine-tests.txt
            legacy-render-*.txt
            port-compare-*.txt
            legacy-sessions.txt
            session-check.txt
            bench.txt
